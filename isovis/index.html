                if (bits & 16) {
                    mu = (iso - value4) / (value5 - value4);
                    var offset = 3 * vertex_count;
                    vertex_array[offset] = points[3 * pz] + (points[3 * pxz] - points[3 * pz]) * mu;

                    var offset = 3 * vertex_count;

                if (bits & 512) {

                    vertex_array[offset] = points[3 * px] + (points[3 * pxz] - points[3 * px]) * mu;
